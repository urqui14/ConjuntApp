<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ConjuntApp - Evaluador de Conjuntos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<div class="container my-5">
    <div class="text-center mb-4">
        <h1 class="text-primary fw-bold">ConjuntApp</h1>
        <p class="text-muted">Motor de Evaluación de Conjuntos, Potencias y Producto Cartesiano</p>
    </div>

    <div class="row">
        <!-- Panel Izquierdo: Entrada de Datos -->
        <div class="col-md-5">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">
                    <h5 class="mb-0">1. Define tus Conjuntos</h5>
                </div>
                <div class="card-body">
                    <div class="mb-3">
                        <label class="form-label fw-bold">Universo (U)</label>
                        <input type="text" id="inputU" class="form-control" placeholder="Ejemplo: 1, 2, 3, 4, 5, 6, 7, 8, 9">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-primary">Conjunto A</label>
                        <input type="text" id="inputA" class="form-control" placeholder="Ejemplo: a, b, c">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-success">Conjunto B</label>
                        <input type="text" id="inputB" class="form-control" placeholder="Ejemplo: 1, 2">
                    </div>
                    <div class="mb-3">
                        <label class="form-label fw-bold text-danger">Conjunto C</label>
                        <input type="text" id="inputC" class="form-control" placeholder="Ejemplo: x, y, z">
                    </div>
                    
                    <hr>
                    <label class="form-label fw-bold">Módulo: Conjunto Potencia (2ⁿ)</label>
                    <div class="d-flex gap-2">
                        <button class="btn btn-outline-primary w-100" onclick="calcularPotenciaUI('A')">2^A</button>
                        <button class="btn btn-outline-success w-100" onclick="calcularPotenciaUI('B')">2^B</button>
                        <button class="btn btn-outline-danger w-100" onclick="calcularPotenciaUI('C')">2^C</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Panel Derecho: Expresiones y Resultados -->
        <div class="col-md-7">
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">
                    <h5 class="mb-0">2. Evaluar Expresión Combinada</h5>
                </div>
                <div class="card-body">
                    <label class="form-label">Escribe la expresión usando: U, ∩, -, Δ, ', ( )</label>
                    <div class="input-group mb-3">
                        <input type="text" id="inputExpresion" class="form-control form-control-lg" placeholder="Ejemplo: (A U B) ∩ C' ">
                        <button class="btn btn-primary" id="btnEvaluar">Evaluar</button>
                    </div>

                    <div class="mb-3">
                        <button class="btn btn-outline-secondary btn-sm btn-simbolo" title="Tecla U">U</button>
                        <button class="btn btn-outline-secondary btn-sm btn-simbolo" title="Tecla N">∩</button>
                        <button class="btn btn-outline-secondary btn-sm btn-simbolo" title="Tecla -">-</button>
                        <button class="btn btn-outline-secondary btn-sm btn-simbolo" title="Tecla D">Δ</button>
                        <button class="btn btn-outline-secondary btn-sm btn-simbolo" title="Apostrofo (Alt+39)">'</button>
                        <button class="btn btn-outline-secondary btn-sm btn-simbolo" title="Tecla 0">Ø</button>
                        <!-- NUEVO BOTÓN LIMPIAR -->
                        <button class="btn btn-danger btn-sm ms-3" id="btnLimpiar" title="Borrar todos los datos">Limpiar</button>
                    </div>
                </div>
            </div>

            <!-- Zona de Resultados -->
            <div class="card shadow-sm border-success">
                <div class="card-header bg-success text-white">
                    <h5 class="mb-0">Resultados y Gráficos</h5>
                </div>
                <div class="card-body">
                    <h4 id="resultadoFinal" class="text-center my-3 text-success">Esperando acción...</h4>
                    <hr>
                    <div id="zonaGrafica" class="text-center mb-3 d-none">
                        <!-- Canvas para el Diagrama Relacional -->
                        <h6>Diagrama Relacional</h6>
                        <canvas id="canvasRelacional" width="400" height="200" class="border rounded bg-white shadow-sm mb-4"></canvas>
                        
                        <!-- Contenedor para el Plano Cartesiano -->
                        <h6>Plano Cartesiano</h6>
                        <div id="contenedorPlanoCartesiano" class="d-flex justify-content-center"></div>
                    </div>

                    <h6>Procedimiento / Desglose:</h6>
                    <ul id="listaPasos" class="list-group list-group-flush small">
                        <li class="list-group-item text-muted">Aún no hay operaciones calculadas.</li>
                    </ul>
                </div>
            </div>
            
            <div class="mt-3 text-end">
                <button class="btn btn-warning shadow-sm" id="btnCartesiano">Graficar Producto Cartesiano (A × B)</button>
            </div>
            
        </div>
    </div>
</div>

<script src="app.js"></script>
</body>
</html>
